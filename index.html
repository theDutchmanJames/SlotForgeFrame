<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The app is one offline page: nothing may be loaded from, or sent to, the network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self' data: blob: ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<script>
  // The SlotForge theme before the first paint; src/app-theme.js owns it (as in Anvil and Foundry).
  (function () {
    var root = document.documentElement, theme = 'dark', custom = null, legacy = null;
    try {
      legacy = localStorage.getItem('chassis.theme');
      var saved = JSON.parse(localStorage.getItem('slotforge.appearance.v1') || 'null');
      theme = (saved && saved.theme) || (legacy === 'light' ? 'light' : 'dark');
      custom = saved && saved.customColors;
    } catch (e) {}
    try { theme = new URL(location.href).searchParams.get('sfTheme') || theme; } catch (e) {}
    root.dataset.theme = theme;
    root.dataset.tone = theme === 'light' || theme === 'ocean' || (theme === 'custom' && legacy === 'light') ? 'light' : 'dark';
    if (theme === 'custom' && custom)
      for (var k in custom) if (/^#[0-9a-f]{6}$/i.test(custom[k])) root.style.setProperty('--' + k, custom[k]);
  })();
</script>
<script>
  // If the app cannot start, say why instead of leaving an empty page.
  (function () {
    function show(text) {
      if (window.slotforgeFrame || document.getElementById('startfail')) return;
      var box = document.createElement('pre');
      box.id = 'startfail';
      box.style.cssText = 'margin:40px;padding:18px 20px;border:1px solid #e5484d;border-radius:10px;font:14px/1.5 Consolas,monospace;white-space:pre-wrap;color:#e8ecf1;background:#1f252d';
      box.textContent = 'SlotForge Frame could not start in this browser.\n\n' + text;
      (document.body || document.documentElement).appendChild(box);
    }
    addEventListener('error', function (e) {
      var t = e.target;
      if (t && t !== window && (t.src || t.href)) {
        // A file that did not arrive is often a passing thing (the page was reloaded halfway): try once more.
        var again = false;
        try { again = !sessionStorage.getItem('slotforge.frame.retried'); if (again) sessionStorage.setItem('slotforge.frame.retried', '1'); } catch (x) {}
        show('A file did not load: ' + (t.src || t.href) + (again ? '\n\nTrying once more…' : '\n\nReload the page to try again.'));
        if (again) setTimeout(function () { location.reload(); }, 1500);
      }
      else show((e.message || 'Unknown error') + (e.filename ? '\n' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
    }, true);
    // Once the app is up, a later failure gets its one retry again.
    addEventListener('load', function () { setTimeout(function () { if (window.slotforgeFrame) try { sessionStorage.removeItem('slotforge.frame.retried'); } catch (x) {} }, 4000); });
    addEventListener('unhandledrejection', function (e) { show(String((e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });
  })();
</script>
<title>SlotForge Frame</title>
